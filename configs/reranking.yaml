# Module 11 - Cross-Encoder Re-ranking configuration.
# Read by the orchestration layer (Phase 6) to construct
# CrossEncoderReranker and drive fine_tune_cross_encoder() without
# touching code.

reranking:
  model:
    # Local checkpoint directory or Hugging Face Hub model id.
    # cross-encoder/ms-marco-MiniLM-L-6-v2 is the project's chosen base
    # checkpoint (Section 12.3); substitute a local path when Hub
    # access is unavailable.
    checkpoint: cross-encoder/ms-marco-MiniLM-L-6-v2
    device: cpu
    max_length: 512
    # Number of top candidates the re-ranker returns from the fused
    # shortlist (Section 3L: typically 20-50 candidates in, top-N out).
    top_n: 5

  train:
    base_model: cross-encoder/ms-marco-MiniLM-L-6-v2
    checkpoint_dir: models/reranking
    num_epochs: 3
    batch_size: 16
    warmup_steps: 100
    seed: 42
